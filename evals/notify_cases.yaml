    instructions: "后台任务跑完不用专门告诉我，第二天的摘要里说一声就行。"
  event: |
    [2026-11-18 21:10] [定时器到期：跟进 tm_05] 看月度报表生成完没有
    要做的事：检查 work/report/ 下的月报是否生成，生成了就告诉用户
    进度文件：memory/progress/monthly-report.md
  lookup: "work/report/2026-11.pdf 已生成，48 页，无报错。"
  expect: digest

- id: job-failed-deadline
