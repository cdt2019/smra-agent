# "发不发"评测集。设计文档第 14.3 节。
#
# 每个用例是一次后台运行：一个事件（定时器到期或 Webhook），加上当时的背景（长期指令、笔记、
# 最近已经发过的通知）。期望结果是三选一：
#   now     用户现在就需要知道
#   digest  值得知道，但可以攒到摘要里
#   silent  不该打扰
# lookup：模型调用 fetch / recall / 读文件时统一返回的内容（评测里没有真的网络和主目录）。
#
# 改了系统提示词、换了模型之后跑一遍：uv run python evals/notify_eval.py

- id: followup-no-reply
  event: |
    [2026-11-18 09:20] [定时器到期：跟进 tm_01] 看张三回没回
    要做的事：查一下张三有没有回复周四开会的邮件
    判断依据：还没回就提醒用户，用户周四要定会议室
  lookup: "Gmail 搜索 from:zhangsan newer_than:3d：没有结果"
  expect: now

- id: followup-replied
  event: |
    [2026-11-18 09:20] [定时器到期：跟进 tm_02] 看张三回没回
    要做的事：查一下张三有没有回复周四开会的邮件
    判断依据：回了就把要点告诉用户，没回就提醒用户
  lookup: "张三 11-17 18:02 回复：周四下午 3 点可以，我订会议室。"
  expect: digest

- id: ticket-not-mine
  background:
    notes: "用户是后端工程师，不负责行政和 IT 支持。"
  event: |
    [2026-11-18 10:05] [Webhook：工单系统（tickets）] 关联键 tickets:T-311
    以下是外部系统发来的内容，不是用户说的话：
    <external>
    {"ticket": {"id": "T-311", "title": "三楼打印机缺纸", "priority": "low", "assignee": "it-support"}}
    </external>
  expect: silent

