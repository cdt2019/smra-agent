# 收紧 smra-agent 的权限：进程仍是 root（要用 docker，docker 组本身就等同 root），但拿掉全部 capability、
# 只能写自己的目录，碰不到内核参数、模块、设备和别人的 /tmp。删掉这个文件再 daemon-reload 即可回退。
# firecracker 驱动要用 /dev/kvm 和网络设备，不适用（install.sh 在 SMRA_DRIVER=firecracker 时不装它）。
[Service]
UMask=0077
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ReadWritePaths=@ROOT@ @HOME@/.docker @HOME@/.cache
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
