<text x="698" y="327" class="t h" text-anchor="start">模型代理</text>
<text x="636" y="352" class="t s" text-anchor="start">密钥只在这里</text>
<text x="636" y="370" class="t s" text-anchor="start">注入检测 · 计费限额</text>
<rect x="620" y="408" width="240" height="112" rx="10" class="gate"/>
