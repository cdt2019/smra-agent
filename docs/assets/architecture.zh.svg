<path d="M494,178 L494,152" class="flow" marker-end="url(#ma)"/>
<path d="M880,60 L880,42 Q880,36 874,36 L311,36 Q305,36 305,42 L305,58" class="flow" marker-end="url(#ma)"/>
<path d="M680,150 L680,266 Q680,272 674,272 L401,272 Q395,272 395,278 L395,298" class="flow" marker-end="url(#ma)"/>
