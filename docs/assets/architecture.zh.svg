<text x="636" y="724" class="t s" text-anchor="start">流量同样经过出口二</text>
<path d="M740,630 L740,658" class="flow" marker-end="url(#ma)"/>
<rect x="1040" y="300" width="220" height="92" rx="10" class="ext"/>
<text x="1056" y="326" class="t h" text-anchor="start">模型提供方</text>
<text x="1056" y="346" class="t s" text-anchor="start">Anthropic · DeepSeek</text>
