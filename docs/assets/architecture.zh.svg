<text x="606" y="124" class="t s" text-anchor="start">选会话 · 启动运行</text>
<rect x="800" y="60" width="160" height="90" rx="10" class="card"/>
<text x="816" y="86" class="t h" text-anchor="start">发件箱</text>
<text x="816" y="106" class="t s" text-anchor="start">每日上限 · 安静时段</text>
<text x="816" y="124" class="t s" text-anchor="start">摘要合并 · 重试</text>
<rect x="410" y="178" width="168" height="68" rx="10" class="card"/>
<text x="426" y="203" class="t h" text-anchor="start">定时器 · Webhook</text>
<text x="426" y="223" class="t s" text-anchor="start">cron · 跟进 · 签名校验</text>
<path d="M172,96 L228,96" class="flow" marker-end="url(#ma)"/>
<path d="M230,128 L174,128" class="flow" marker-end="url(#ma)"/>
<path d="M380,105 L408,105" class="flow" marker-end="url(#ma)"/>
